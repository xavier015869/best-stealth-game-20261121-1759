<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonvault — a top-down stealth game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" width="1280" height="900"></canvas>
<div id="help">
  <span><b>WASD / Arrows</b> move</span>

  <span><b>Shift</b> sprint (fast, loud)</span>
  <span><b>R</b> retry a night</span>
  <span><b>M</b> mute</span>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
